{% load i18n %}<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ og_title }}</title>
    <meta name="description" content="{{ og_description }}">
    <link rel="canonical" href="{{ canonical_url }}">

    <!-- Open Graph -->
    <meta property="og:type" content="product">
    <meta property="og:site_name" content="{{ site_name }}">
    <meta property="og:title" content="{{ og_title }}">
    <meta property="og:description" content="{{ og_description }}">
    <meta property="og:url" content="{{ canonical_url }}">
    {% if image_url %}
    <meta property="og:image" content="{{ image_url }}">
    <meta property="og:image:alt" content="{{ og_title }}">
    {% if image_width %}<meta property="og:image:width" content="{{ image_width }}">{% endif %}
    {% if image_height %}<meta property="og:image:height" content="{{ image_height }}">{% endif %}
    {% endif %}
    {% if price_amount %}
    <meta property="product:price:amount" content="{{ price_amount }}">
    <meta property="product:price:currency" content="{{ price_currency }}">
    {% endif %}

    <!-- Twitter Card -->
    <meta name="twitter:card" content="{% if image_url %}summary_large_image{% else %}summary{% endif %}">
    <meta name="twitter:title" content="{{ og_title }}">
    <meta name="twitter:description" content="{{ og_description }}">
    {% if image_url %}<meta name="twitter:image" content="{{ image_url }}">{% endif %}

    <!-- Send real visitors to the app; crawlers keep the meta tags above. -->
    <meta http-equiv="refresh" content="0; url={{ redirect_url }}">
</head>
<body>
    <p>{% trans "Opening listing…" %} <a href="{{ redirect_url }}">{% trans "Open listing" %}</a></p>
    <script>window.location.replace("{{ redirect_url|escapejs }}");</script>
</body>
</html>
